name: Documentation Reminder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  check-docs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          echo "Changed files:"
          echo "$FILES"

          # Check for structural changes
          STRUCTURAL=false

          if echo "$FILES" | grep -qE '(plugins/|server/|lib/env|\.server\.ts|vite\.config|package\.json|tsconfig)'; then
            STRUCTURAL=true
          fi

          echo "structural_changes=$STRUCTURAL" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: steps.changed-files.outputs.structural_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Documentation Checklist')
            );

            const commentBody = `## 📋 Documentation Checklist

            ⚠️ **This PR contains structural changes that may require documentation updates.**

            **Please confirm if updates are needed for:**

            - [ ] **README.md** - Did commands, setup, or initial configuration change?
            - [ ] **CLAUDE.md** - Were new conventions, patterns, or workflows added?
            - [ ] **docs/** - Did architecture, technical decisions, or development guides change?
            - [ ] **CHANGELOG.md** - Were changes to public packages documented?
            - [ ] **JSDoc/TSDoc** - Were public APIs documented?

            ---

            **Files that typically require documentation:**
            - Changes in \`plugins/\` or \`server/\`
            - Modifications to the environment system (\`lib/env\`)
            - New patterns (server actions, API routes, etc.)
            - Build configuration changes (\`vite.config\`, \`tsconfig\`)

            **If documentation is not applicable**, please justify in the PR description or comments.

            **Reviewer:** Please validate that documentation is adequate before approving. 🔍`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
