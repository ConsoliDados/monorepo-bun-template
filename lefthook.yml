# Lefthook Configuration
# See: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    block-dev-branch:
      runner: bash
      run: |
        BRANCH=$(git branch --show-current)

        if [ "$BRANCH" = "dev" ]; then
          echo ""
          echo "❌ ERROR: Direct commits to 'dev' branch are not allowed!"
          echo ""
          echo "📋 Required workflow:"
          echo "  1. Create feature branch: git checkout -b feature/your-feature-name"
          echo "  2. Make your changes and commit"
          echo "  3. Push and create Pull Request to 'dev'"
          echo ""
          echo "💡 If you have uncommitted changes on dev, run:"
          echo "   git checkout -b feature/your-feature-name"
          echo "   (this will keep your changes and move them to the new branch)"
          echo ""
          exit 1
        fi

        echo "✅ Commit allowed on branch: $BRANCH"

